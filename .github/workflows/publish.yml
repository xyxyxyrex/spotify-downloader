name: Publish Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    timeout-minutes: 60
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tauri-gui/package-lock.json

      - name: Validate release metadata and updater public key
        run: node tauri-gui/scripts/validate_release_config.mjs $env:GITHUB_REF_NAME

      - name: Validate updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured. The updater cannot publish unsigned installers."
          }

          $normalizedSigningKey = $env:TAURI_SIGNING_PRIVATE_KEY -replace '\s', ''
          try {
            $decodedSigningKey = [Convert]::FromBase64String($normalizedSigningKey)
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY is not valid base64 after whitespace normalization."
          }
          if ($decodedSigningKey.Length -lt 64) {
            throw "TAURI_SIGNING_PRIVATE_KEY is unexpectedly short."
          }
          Write-Output "::add-mask::$normalizedSigningKey"
          "TAURI_SIGNING_PRIVATE_KEY=$normalizedSigningKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.11.1,<7" "pytest>=8.3.3,<10"

      - name: Test Spotify profile importer
        run: python -m pytest tauri-gui/tests -q

      - name: Build Frozen Binaries and Download dependencies
        run: |
          python tauri-gui/build_binaries.py

      - name: Install Node dependencies
        working-directory: tauri-gui
        run: npm ci

      - name: Check frontend syntax
        run: node --check tauri-gui/src/main.js

      - name: Build and Publish Tauri App
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'SpotDL GUI v__VERSION__'
          releaseBody: 'Fix Spotify profile playlist imports and improve updater release validation.'
          releaseDraft: false
          prerelease: false
          projectPath: tauri-gui
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      # Releases through v0.3.5 read the raw updater.json endpoint. Keep it in
      # sync while newer clients migrate to the release-hosted latest.json.
      - name: Normalize updater URLs and sync legacy updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '${{ steps.tauri.outputs.appVersion }}'
          $manifestDir = Join-Path $env:RUNNER_TEMP 'tauri-release-manifest'
          $downloadDir = Join-Path $manifestDir 'downloaded'
          $normalizedDir = Join-Path $manifestDir 'normalized'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          New-Item -ItemType Directory -Path $normalizedDir -Force | Out-Null
          $downloadedManifest = Join-Path $downloadDir 'latest.json'
          $normalizedManifest = Join-Path $normalizedDir 'latest.json'

          gh release download "v$version" --pattern latest.json --dir $downloadDir --clobber
          node tauri-gui/scripts/update_updater_manifest.mjs `
            $downloadedManifest updater.json $version $normalizedManifest
          gh release upload "v$version" $normalizedManifest --clobber

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater.json
          $stagedFiles = @(git diff --cached --name-only)
          if ($stagedFiles.Count -eq 0) {
            Write-Output 'Legacy updater manifest is already current.'
          } else {
            git commit -m "chore: update installer manifest to v$version [skip ci]"
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          }
