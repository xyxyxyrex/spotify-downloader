name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tauri-gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build Frozen Binaries and Download dependencies
        run: |
          python tauri-gui/build_binaries.py

      - name: Install Node dependencies
        working-directory: tauri-gui
        run: npm ci

      - name: Validate release version and signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured. The updater cannot publish unsigned installers."
          }

          $normalizedSigningKey = $env:TAURI_SIGNING_PRIVATE_KEY -replace '\s', ''
          try {
            [void][Convert]::FromBase64String($normalizedSigningKey)
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY is not valid base64 after whitespace normalization."
          }
          Write-Output "::add-mask::$normalizedSigningKey"
          "TAURI_SIGNING_PRIVATE_KEY=$normalizedSigningKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $packageVersion = node -p "require('./tauri-gui/package.json').version"
          $tauriVersion = (Get-Content tauri-gui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = ((Get-Content tauri-gui/src-tauri/Cargo.toml | Select-String '^version = "([^"]+)"').Matches.Groups[1].Value)
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if (@($packageVersion, $tauriVersion, $cargoVersion) | Where-Object { $_ -ne $tagVersion }) {
            throw "Release tag v$tagVersion does not match package=$packageVersion, tauri=$tauriVersion, cargo=$cargoVersion"
          }

      - name: Build and Publish Tauri App
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'SpotDL GUI v__VERSION__'
          releaseBody: 'Release notes and binaries for version v__VERSION__.'
          releaseDraft: false
          prerelease: false
          projectPath: tauri-gui
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      # Releases through v0.3.5 read the raw updater.json endpoint. Keep it in
      # sync while newer clients migrate to the release-hosted latest.json.
      - name: Validate installer signature and sync legacy updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '${{ steps.tauri.outputs.appVersion }}'
          $manifestDir = Join-Path $env:RUNNER_TEMP 'tauri-release-manifest'
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          gh release download "v$version" --pattern latest.json --dir $manifestDir --clobber
          node tauri-gui/scripts/update_updater_manifest.mjs `
            (Join-Path $manifestDir 'latest.json') updater.json $version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater.json
          if (git diff --cached --quiet) {
            Write-Output 'Legacy updater manifest is already current.'
          } else {
            git commit -m "chore: update installer manifest to v$version [skip ci]"
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          }
